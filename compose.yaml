services:
  viewer:
    build: .
    ports:
      - "127.0.0.1:8768:8768"
    volumes:
      - ./config.docker.local.json:/config/config.local.json:ro
      - ./data:/data:ro
      - ${YUBI_DATASET_ROOT:?Set YUBI_DATASET_ROOT}:/dataset:ro
      - ./.cache/videos:/cache/videos
    restart: unless-stopped
