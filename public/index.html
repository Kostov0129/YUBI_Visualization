<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUBI 轨迹查看器</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f8fafb,#111820);--fg:light-dark(#1d303a,#e5eef4);--line:light-dark(#ced9df,#344753);--left:light-dark(#007e98,#42d4e9);--right:light-dark(#bd5c21,#ffa265);--neutral:light-dark(#9eabb1,#839eae)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:20px}h1{font-size:23px;font-weight:500;margin:0 0 16px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-size:13px}select,input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}button{cursor:pointer}select{max-width:100%}#record{width:380px}#scene{height:560px;width:100%;position:relative;margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none}canvas{display:block}#legend{position:absolute;left:14px;top:12px;pointer-events:none;background:var(--bg);padding:6px 9px;border-radius:4px}.left{color:var(--left)}.right{color:var(--right)}#status{margin:10px 0;min-height:24px;font-size:13px}#time{width:100%;padding:0}#detail{font-variant-numeric:tabular-nums;font-size:13px;margin-top:10px;overflow-wrap:anywhere}.play{display:flex;align-items:center;gap:12px}.play label{display:flex;align-items:center}.play span{min-width:150px}a{color:var(--left)}@media(max-width:650px){main{padding:12px}#scene{height:420px}#record{width:100%}.controls>label{flex:1 1 160px}.play{flex-wrap:wrap}}
#videos{margin-top:24px}.video-heading{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}#video-status{font-size:13px}.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.video-grid figure{margin:0;min-width:0}.video-grid figcaption{margin-bottom:8px;font-size:13px}.video-grid video{width:100%;aspect-ratio:4/3;display:block;background:var(--line);border-radius:6px}@media(max-width:700px){.video-grid{grid-template-columns:1fr}}
.pagination{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.pagination label{display:flex;align-items:center;gap:6px}#page{width:72px}#page-info{font-size:13px}#scene{user-select:none}button:disabled{opacity:.45;cursor:default}
.record-field{display:grid;gap:5px;font-size:13px;min-width:260px}#record-picker{position:relative}#record-label{padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;min-width:300px}.record-menu{position:absolute;top:calc(100% + 5px);right:0;width:min(560px,calc(100vw - 40px));z-index:20;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 8px 24px #0003}.record-menu #record{width:100%;height:240px;padding:4px}.record-menu option{padding:8px}.record-menu .pagination{gap:6px}.record-menu #page-info{width:100%}@media(max-width:650px){.record-field{width:100%}#record-label{min-width:0}.record-menu{left:0;right:auto}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><main>
<h1>YUBI · 夹爪与轨迹</h1>
<div class="controls"><label>数据范围<select id="scope"><option value="all">两项任务全部 · 3844 组</option><option value="practice">官方 replay 子集 · 10 组</option></select></label><label>夹爪外形<select id="geometry"><option value="simple">简化网格</option><option value="detail">官方细节网格</option></select></label><label>任务<select id="task"><option value="cup">杯子放到盘子，再放回原位 · 1997 组</option><option value="phone">手机装盒 · 1847 组</option></select></label><div class="record-field"><span>选择记录</span><details id="record-picker"><summary id="record-label">选择记录</summary><div class="record-menu"><select id="record" size="8" aria-label="选择记录"></select><div class="pagination" aria-label="记录分页"><button id="prev-page">上一页</button><label>第 <input id="page" type="number" min="1" value="1" step="1" aria-label="记录页码"> 页</label><button id="jump-page">跳转</button><button id="next-page">下一页</button><span id="page-info" aria-live="polite"></span></div></div></details></div><label>显示模式<select id="mode"><option value="raw">原始双手轨迹</option><option value="franka_fr3:left">Franka · 左手参考 IK</option><option value="franka_fr3:right">Franka · 右手参考 IK</option><option value="openarm_v2:left">OpenArm · 左手参考 IK</option><option value="openarm_v2:right">OpenArm · 右手参考 IK</option></select></label></div>
<div id="scene" role="img" aria-label="可旋转缩放的三维夹爪及轨迹"><div id="legend"><span class="left">● 左手</span>　<span class="right">● 右手</span>　网格 10 cm</div></div>
<div id="status" aria-live="polite">正在读取本机数据…</div><div class="play"><button id="play">播放</button><button id="reset">适配视角</button><label>速度<select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><span id="clock">0.00 s</span></div><label>帧进度<input id="time" type="range" min="0" max="1" value="0" step="1"></label><div id="detail"></div>
<section id="videos" aria-label="同步视频"><div class="video-heading"><span>同步视频</span><span id="video-status" aria-live="polite">请选择记录</span><button id="video-retry" hidden>重试加载</button></div><div class="video-grid"><figure><figcaption>左腕相机</figcaption><video id="video-left" muted playsinline preload="auto"></video></figure><figure><figcaption>中间相机</figcaption><video id="video-center" muted playsinline preload="auto"></video></figure><figure><figcaption>右腕相机</figcaption><video id="video-right" muted playsinline preload="auto"></video></figure></div></section>
</main><script type="module" src="./viewer.js"></script></body></html>
